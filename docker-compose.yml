version: "3"
services:
  springboot-app:
    image: soufi2001/devopsback:SofienDaadoucha-5ArcTIC3-devops
    restart: always
    ports:
      - "8082:8080"
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_PORT: 3306


  mysqldb:
    container_name: mysqldb
    image: mysql:latest
    volumes:
      - /home/user/Desktop/db:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: root
    restart: always
    
   
  angular-app:
    image: soufi2001/devopsfront:SofienDaadoucha-5ArcTIC3-devops
    ports:
      - "4200:80"
    depends_on:
      - springboot-app
    restart: always

volumes:
  db_data:
